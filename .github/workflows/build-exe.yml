name: Build Desktop EXE

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build backend with PyInstaller
        run: |
          python -m PyInstaller backend/trading_signal_system.spec --distpath backend/dist --workpath backend/build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron desktop app
        working-directory: frontend
        run: npm run dist

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            frontend/dist/*.exe
            frontend/dist/**/*.exe

      - name: Upload exe to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.ref || format('desktop-{0}', github.run_id) }}
          name: Desktop build ${{ github.run_id }}
          draft: ${{ github.event_name == 'push' }}
          files: |
            frontend/dist/*.exe
            frontend/dist/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
